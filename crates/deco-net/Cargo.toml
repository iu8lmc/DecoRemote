[package]
name = "deco-net"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
deco-proto = { version = "0.1.0", path = "../deco-proto" }
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
tokio = { version = "1.54.1", features = ["rt", "net", "time", "macros", "io-util", "sync"] }
tracing = "0.1.44"
