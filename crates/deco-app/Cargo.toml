[package]
license = "MIT"
name = "decoremote"
version = "0.1.7"
edition = "2024"

[dependencies]
deco-net = { path = "../deco-net" }
anyhow = "1.0.104"
arboard = "3.7.0"
bytemuck = "1.25.2"
deco-codec = { version = "0.1.0", path = "../deco-codec" }
deco-proto = { version = "0.1.0", path = "../deco-proto" }
dirs = "7.0.0"
eframe = "0.37.0"
egui = "0.37.0"
enigo = "0.6.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
jpeg-encoder = "0.7.1"
rand = "0.10.3"
scrap = { path = "../../vendor/scrap" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
windows-sys = { version = "0.61.2", features = ["Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }
rfd = "0.17.2"
